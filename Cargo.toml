[package]
name = "orx-concurrent-iter"
version = "4.1.0"
edition = "2024"
authors = ["orxfun <orx.ugur.arikan@gmail.com>"]
description = "A thread-safe and ergonomic concurrent iterator trait and efficient lock-free implementations."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orxfun/orx-concurrent-iter/"
keywords = ["concurrency", "iterator", "iteration", "atomic", "parallelism"]
categories = ["data-structures", "concurrency", "rust-patterns", "no-std"]

[dependencies]
orx-iterable = { version = "1.3", default-features = false }
orx-pseudo-default = { version = "2.1", default-features = false }

[dev-dependencies]
orx-pinned-vec = "4.0.0"
orx-fixed-vec = "4.0.0"
orx-split-vec = "4.0.0"
orx-pinned-concurrent-col = "3.0"
orx-concurrent-bag = "4.0"
test-case = "3.3.1"
criterion = "0.8.0"
orx-criterion = "1.0.0"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.12.0"

[[bench]]
name = "con_iter_of_iter_small"
harness = false

[[bench]]
name = "con_iter_of_iter"
harness = false

[[bench]]
name = "con_iter_of_vec"
harness = false

[[bench]]
name = "con_iter_of_slice"
harness = false

[[bench]]
name = "con_iter_of_slice_mut"
harness = false

[[bench]]
name = "con_iter_of_range"
harness = false

[[bench]]
name = "con_iter_of_vec_drain"
harness = false

[[bench]]
name = "con_iter_of_vec_deque_ref"
harness = false

[[bench]]
name = "con_iter_copied"
harness = false
